function bpmColor(index, total, alpha) {
  var stops = [
    [0xFF/255, 0x97/255, 0x41/255],
    [0xF3/255, 0xC0/255, 0x91/255],
    [0xF9/255, 0x78/255, 0x4A/255],
    [0xD2/255, 0x60/255, 0x45/255],
    [0xA4/255, 0xC3/255, 0xBE/255],
  ];
  var t = index / (total - 1);
  var scaled = t * (stops.length - 1);
  var i = Math.floor(scaled);
  var f = scaled - i;
  if(i >= stops.length - 1) return new Color(stops[stops.length-1][0], stops[stops.length-1][1], stops[stops.length-1][2], alpha);
  var r = stops[i][0] + f * (stops[i+1][0] - stops[i][0]);
  var g = stops[i][1] + f * (stops[i+1][1] - stops[i][1]);
  var b = stops[i][2] + f * (stops[i+1][2] - stops[i][2]);
  return new Color(r, g, b, alpha);
}

function getMoodCategory(v) {
  if(v === null) return 'none';
  if(v >= 0.75) return 'euphoric';
  if(v <= 0.5)  return 'melancholic';
  return 'intense';

  var alpha = 0.5 + (s.views / maxViews) * 0.35;

  var path = new Path({
    strokeColor: bpmColor(i, n, alpha),
    strokeWidth: thickness,
    strokeCap: 'round',
    strokeJoin: 'round',
  });

  for(var j = 0; j <= POINTS; j++) {
    path.add(new Point(j * W / POINTS, baseY));
  }
  path.smooth();
  paths.push(path);
  phases.push(Math.random() * Math.PI * 2);
}

    var baseY = padTop + (i + 0.5) * slotH;
    var tempo = s.tempo || 80;
    var energy = s.energy || 0.1;
    var freq = (tempo / 120) * 0.055;
    var amp = energy * slotH * 1.8;
    var phase = phases[i];

    var isHovered = (i === hoveredIdx);

    for(var j = 0; j <= POINTS; j++) {
      var x = j * W / POINTS;
      var y = baseY + amp * Math.sin(freq * t + j * 0.9 + phase);
      path.segments[j].point = new Point(x, y);
    }
    path.smooth();

    var mood = getMoodCategory(s.valence);
    var currentFilter = (typeof window !== 'undefined' && window.paperActiveFilter) ? window.paperActiveFilter : 'all';
    var inFilter = (currentFilter === 'all') || (mood === currentFilter);

    if(hoveredIdx >= 0) {
      path.opacity = isHovered ? 1 : 0.04;
      if(isHovered) path.strokeWidth = 0.4 + (s.views / maxViews) * 3.5 + 1.5;
    } else if(!inFilter) {
      path.opacity = 0.03;
      path.strokeWidth = 0.4 + (s.views / maxViews) * 3.5;
    } else {
      path.opacity = 0.5 + (s.views / maxViews) * 0.35;
      path.strokeWidth = 0.4 + (s.views / maxViews) * 3.5;
    }
  }
};

view.onMouseMove = function(event) {
  var my = event.point.y;
  var closest = -1;
  var minDist = slotH * 1.2;

  for(var i = 0; i < n; i++) {
    var baseY = padTop + (i + 0.5) * slotH;
    var dist = Math.abs(my - baseY);
    if(dist < minDist) {
      minDist = dist;
      closest = i;
    }
  }

  if(closest !== hoveredIdx) {
    hoveredIdx = closest;
    if(closest >= 0) showCard(songs[closest]);
    else hideCard();
  }
};

view.onMouseLeave = function() {
  hoveredIdx = -1;
  hideCard();
};

// Touch support
view.on('touchmove', function(event) {
  event.preventDefault();
  var touch = event.event.touches[0];
  var rect = view.element.getBoundingClientRect();
  var my = (touch.clientY - rect.top) * (view.size.height / rect.height);
  var closest = -1;
  var minDist = slotH * 2.5;
  for(var i = 0; i < n; i++) {
    var baseY = padTop + (i + 0.5) * slotH;
    var dist = Math.abs(my - baseY);
    if(dist < minDist) { minDist = dist; closest = i; }
  }
  if(closest !== hoveredIdx) {
    hoveredIdx = closest;
    if(closest >= 0) showCard(songs[closest]);
    else hideCard();
  }
});

view.on('touchend', function() {
  hoveredIdx = -1;
  hideCard();
});

function showCard(s) {
  var card = document.getElementById('card');
  document.getElementById('c-year').textContent = s.year;
  document.getElementById('c-title').textContent = s.title;
  document.getElementById('c-views').textContent = (s.views/1e6).toFixed(0) + 'M YouTube views';
  document.getElementById('c-bpm').textContent = s.tempo ? Math.round(s.tempo) : '—';
  document.getElementById('c-energy').textContent = s.energy ? Math.round(s.energy*100)+'%' : '—';
  document.getElementById('c-valence').textContent = s.valence ? Math.round(s.valence*100)+'%' : '—';
  document.getElementById('c-dance').textContent = s.dance ? Math.round(s.dance*100)+'%' : '—';

  var dot = document.getElementById('c-dot');
  var label = document.getElementById('c-mood-label');
  if(s.valence === null) {
    dot.style.background = '#2a2a2a';
    label.textContent = 'no audio data';
    label.style.color = '#333';
  } else if(s.valence >= 0.75) {
    dot.style.background = '#FF9741';
    label.textContent = 'euphoric';
    label.style.color = '#FF9741';
  } else if(s.valence <= 0.5) {
    dot.style.background = '#A4C3BE';
    label.textContent = 'melancholic';
    label.style.color = '#A4C3BE';
  } else {
    dot.style.background = '#F9784A';
    label.textContent = 'intense';
    label.style.color = '#F9784A';
  }
  card.style.display = 'block';
}

function hideCard() {
  document.getElementById('card').style.display = 'none';
}

// Resize canvas to window
view.viewSize = new Size(window.innerWidth, window.innerHeight);

</script>

<script>
  // Resize handler
  window.addEventListener('resize', function() {
    var canvas = document.getElementById('cv');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  });
  var cv = document.getElementById('cv');
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;

  // Legend filter
  document.querySelectorAll('.leg').forEach(function(el) {
    el.addEventListener('click', function() {
      var filter = el.getAttribute('data-filter');
      // Toggle off if already active
      if(window._activeFilter === filter && filter !== 'all') {
        window._activeFilter = 'all';
      } else {
        window._activeFilter = filter;
      }
      // Update Paper.js activeFilter via global
      var ps = paper.projects[0];
      // We communicate via a global the paperscript can read
      window.paperActiveFilter = window._activeFilter;
      // Update legend styles
      document.querySelectorAll('.leg').forEach(function(l) {
        l.classList.remove('active');
      });
      if(window._activeFilter !== 'all') {
        document.querySelector('[data-filter="'+window._activeFilter+'"]').classList.add('active');
      }
    });
  });
  window._activeFilter = 'all';
  window.paperActiveFilter = 'all';
</script>
